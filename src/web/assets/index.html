<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zerch</title>
  <link rel="stylesheet" href="app.css" />
  <!-- The server injects the bootstrap object here as JSON. `</` is escaped to
       `<\/` server-side so log content / file names can't break out of the tag. -->
  <script type="application/json" id="zerch-bootstrap">__BOOTSTRAP__</script>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1>zerch</h1>
        <span class="viewing">Viewing: <span id="file-name"></span></span>
      </div>
      <div class="header-right">
        <span id="match-counter" class="match-counter" hidden>
          <button id="prev-match" class="nav" title="Previous match (N)">‹</button>
          <span id="match-n"></span>
          <button id="next-match" class="nav" title="Next match (n)">›</button>
        </span>
        <button id="regex-toggle" class="regex-toggle" title="Regular expression">.*</button>
        <span class="search-wrap">
          <input id="search" class="search-input" type="text" placeholder="Search..."
                 autocomplete="off" spellcheck="false" />
          <button id="search-clear" class="search-clear" title="Clear" hidden>×</button>
        </span>
        <button id="search-btn" class="btn btn-search">Search</button>
        <button id="filter-btn" class="btn btn-filter" title="Add current term as a filter">Filter</button>
        <button id="highlight-btn" class="btn btn-highlight" title="Add current term as a highlight">Highlight</button>
        <span id="total-lines" class="muted"></span>
      </div>
    </header>
    <main class="main-content">
      <div id="log-viewer" class="log-viewer">
        <div id="scroller" class="scroller">
          <div id="spacer" class="spacer"></div>
          <div id="rows" class="rows"></div>
        </div>
      </div>
      <aside id="right-panel" class="right-panel">
        <button id="panel-toggle" class="panel-toggle" title="Collapse/expand">▶</button>
        <div class="panel-content">
          <section class="panel-section">
            <div class="section-head">
              <span class="section-title">Filters</span>
              <button id="mode-toggle" class="mode-toggle" title="Match ALL / ANY">AND</button>
            </div>
            <div id="filter-list" class="plist"></div>
          </section>
          <section class="panel-section">
            <div class="section-head">
              <span class="section-title">Highlights</span>
            </div>
            <div id="highlight-list" class="plist"></div>
          </section>
        </div>
      </aside>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
