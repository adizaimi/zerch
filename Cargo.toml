[package]
name = "zerch"
version = "0.7.6"
edition = "2021"
rust-version = "1.80"
description = "A less-but-smarter terminal log viewer: search, filters, highlights, bookmarks, and log-level/time awareness."
authors = ["Adi Zaimi <adizaimi@yahoo.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["log", "viewer", "tui", "pager", "less"]
categories = ["command-line-utilities"]

[[bin]]
name = "zerch"
path = "src/main.rs"

# Debian packaging via `cargo deb`. Runtime Depends are derived automatically from
# the linked libraries (dpkg-shlibdeps), so the .deb stays lean.
[package.metadata.deb]
maintainer = "Adi Zaimi <adizaimi@yahoo.com>"
copyright = "2026, Adi Zaimi"
license-file = ["LICENSE-MIT", "0"]
section = "utils"
priority = "optional"
extended-description = "A less-but-smarter terminal log viewer: search, filters, highlights, bookmarks, and log-level/time awareness, over an in-memory index that scales to multi-GB files."
assets = [
    ["target/release/zerch", "usr/bin/", "755"],
    ["man/zerch.1", "usr/share/man/man1/zerch.1", "644"],
    ["README.md", "usr/share/doc/zerch/README", "644"],
    ["LICENSE-MIT", "usr/share/doc/zerch/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/zerch/LICENSE-APACHE", "644"],
]

# Dependencies are added phase-by-phase as features land (kept intentionally lean):
#   ratatui, crossterm  (TUI)      regex   (linear search)   memmap2 (mmap)
#   rayon (parallel scan)          memchr  (fast literal)    rusqlite (Tier-2 index)
[dependencies]
regex = "1"
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
memchr = "2"
rayon = "1"
form_urlencoded = "1"
ratatui = "0.29"
tempfile = "3"
# Blocking, pure-Rust HTTP for the local `--web` browser UI. default-features = false
# drops every TLS backend (loopback-only, no TLS) so no openssl-sys enters the deb.
tiny_http = { version = "0.12", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimized, but keeps symbols + unwinding so panics/`lldb` give good stack traces.
# Build with: cargo build --profile release-debug  →  target/release-debug/zerch
[profile.release-debug]
inherits = "release"
strip = false
debug = true
panic = "unwind"
